{% extends "base.html" %}
{% block title %}Create account / {{ site_name }}{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-bird">{{ bird() }}</div>
    <h1>Create your account</h1>
    <form method="post" class="auth-form">
      <label>Username <span class="hint">letters, numbers, underscore &middot; 2-15 chars</span>
        <input type="text" name="username" value="{{ form.username or '' }}" required autofocus>
      </label>
      <label>Display name
        <input type="text" name="display_name" value="{{ form.display_name or '' }}">
      </label>
      <label>Email
        <input type="email" name="email" value="{{ form.email or '' }}" required>
      </label>
      <label>Password <span class="hint">at least 8 characters</span>
        <input type="password" name="password" required>
      </label>
      <label>Confirm password
        <input type="password" name="confirm" required>
      </label>
      <button class="btn btn-primary btn-block" type="submit">Sign up</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
